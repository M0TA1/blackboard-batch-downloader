<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文件夹下载 · Blackboard</title>
  <link rel="stylesheet" href="downloader.css">
  <script type="module" src="downloader.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="header-inner"><span class="brand-mark" aria-hidden="true">Bb<span>↓</span></span><div><p class="eyebrow">BLACKBOARD · 文件夹下载</p><h1>选一次文件夹，保存整批文件</h1></div><span class="local-badge">本地保存</span></div>
  </header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">来自当前课程页面</p><h2 id="page-title">正在读取下载计划…</h2></div><span id="file-count" class="count-badge">— 个文件</span></div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <section class="destination-card" aria-labelledby="destination-title">
      <div class="folder-icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"></path><path d="M3 10h18"></path></svg></div>
      <div class="destination-copy"><h2 id="destination-title">保存到一个文件夹</h2><p id="folder-name">尚未选择文件夹</p><p id="destination-hint" class="subtle">只需选择一次；已有同名文件会自动加序号。</p></div>
      <button id="start-button" class="button primary" type="button" disabled>正在准备…</button>
      <div id="permission-section" class="permission-section" hidden><p>下载所需的附件网站：</p><ul id="permission-domains" aria-label="附件网站"></ul><p id="permission-hint">授权后，再选择保存文件夹。只请求这些附件网站的访问权限。</p></div>
    </section>
    <section class="files-card" aria-labelledby="progress-title">
      <div class="progress-heading"><div><h2 id="progress-title">待保存文件</h2><p id="progress-summary" role="status" aria-live="polite">正在载入…</p></div><button id="stop-button" class="button secondary" type="button" disabled>停止等待项</button></div>
      <div id="batch-progress" class="progress-track" role="progressbar" aria-label="文件保存进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
      <ol id="file-list" class="file-list" aria-label="下载文件列表"></ol>
    </section>
    <p class="keep-open-note"><span aria-hidden="true">●</span> 下载时请保持此页面打开。关闭弹窗不会影响此处保存，关闭或刷新此页面会中断未完成的文件。</p>
    <p class="privacy-note">文件直接保存到你选择的本地文件夹。此页面不会保存文件夹授权，也不会上传文件。</p>
  </main>
</body>
</html>
